<html>

<head>
    <meta charset="UTF-8" />
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/register_login.css" />
</head>

<body>

    <div class="page-account">
        <div class="form-account">

            <h2 class="inner-title">Đổi mật khẩu</h2>

            <form class="inner-form" id="reset-password-form">

                <div class="inner-group">
                    <label class="inner-label">Mật khẩu mới</label>
                    <input class="inner-control" type="password" id="newPassword" required />
                </div>

                <div class="inner-group">
                    <label class="inner-label">Xác nhận mật khẩu</label>
                    <input class="inner-control" type="password" id="cfPassword" required />
                </div>

                <button class="inner-button">Đổi mật khẩu</button>

            </form>

        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>

</html>
