<div class="review-container">

    <h2>Đánh giá của khách hàng</h2>

    <div id="review-list"></div>

    <button onclick="toggleReviewForm()" class="review-btn">
        Viết đánh giá
    </button>

    <div class="review-form" id="review-form" style="display:none;">

        <h3>Hãy để lại đánh giá</h3>

        <input type="text" id="name" placeholder="Tên của bạn">
        <input type="email" id="email" placeholder="Email">

        <textarea id="comment" placeholder="Nội dung đánh giá"></textarea>

        <h4>Đánh giá</h4>

        <div class="stars">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>

        <button onclick="submitReview()">Gửi đánh giá</button>

    </div>

</div>
