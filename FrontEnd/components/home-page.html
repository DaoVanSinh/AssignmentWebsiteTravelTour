<main class="homepage">
  <section class="hero">
    <div class="hero-overlay">
      <div class="hero-content">
        <h1 class="hero-title">Du lịch Việt Nam</h1>
        <div class="search-box">
          <div class="search-row">
            <div class="input-field full-width">
              <i class="fas fa-map-marker-alt"></i>
              <select name="destination">
                <option value="">Bạn muốn đi đâu?</option>
                <option value="halong">Hạ Long</option>
                <option value="phuquoc">Phú Quốc</option>
              </select>
              <i class="fas fa-chevron-down arrow-select"></i>
            </div>
          </div>

          <div class="search-row flex-group">
            <div class="input-field">
              <i class="fas fa-user"></i>
              <select name="guests">
                <option value="">Số lượng</option>
              </select>
              <i class="fas fa-chevron-down arrow-select"></i>
            </div>

            <div class="input-field">
              <i class="fas fa-calendar-alt"></i>
              <input type="text" placeholder="dd/mm/yyyy" />
            </div>

            <button type="submit" class="btn-search">
              <i class="fas fa-search"></i> Tìm Kiếm
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
