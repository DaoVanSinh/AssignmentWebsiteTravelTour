<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../css/register_login.css"/>
  </head>
  <body>
    <div class="page-account">
      <div class="form-account">
        <h2 class="inner-title">Đăng nhập</h2>
        <form class="inner-form" id="login-form">
          <div class="inner-group">
            <label class="inner-label" for="email">Email</label>
            <input class="inner-control" type="email" name="email" id="email" placeholder="Ví dụ: nguyendinha@gmail.com"/>
          </div>
          <div class="inner-group">
            <label class="inner-label" for="password">Mật khẩu</label>
            <input class="inner-control" type="password" name="password" id="password"/>
          </div>
          <div class="inner-meta">
            <div class="inner-confirm">
              <input class="inner-check" type="checkbox" name="rememberPassword" id="remember-password"/>
              <label class="inner-label" for="remember-password">Nhớ mật khẩu</label>
            </div><a class="inner-forgot-password" href="../pages/forgot-password.html">Quên mật khẩu?</a>
          </div>
          <button class="inner-button">Đăng Nhập</button>
        </form>
        <div class="inner-more"><span>Bạn chưa có tài khoản ? Hãy đăng ký ngay!</span><a href="../pages/register.html">Tạo tài khoản</a></div>
      </div>
    </div>
    <script src="../js/auth.js"></script> 
  </body>
</html>
