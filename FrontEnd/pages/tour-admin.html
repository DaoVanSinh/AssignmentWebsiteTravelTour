<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tour</title>
    <link rel="stylesheet" href="../css/tour-admin.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý Tour</h2>
        <button class="btn-add" onclick="openModal()">+ Thêm Tour</button>

<div class="container">

<div class="admin-box">

<h2>Quản Lý Tour</h2>

<button class="btn-add" onclick="openAddModal()">+ Thêm Tour</button>

<table>
=======
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Tour</th>
                    <th>Thời gian</th>
                    <th>Nơi khởi hành</th>
                    <th>Giá Người Lớn</th>
                    <th>Giá Trẻ Em</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="tourTableBody">
                </tbody>
        </table>
    </div>

    <div id="tourModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Thông tin Tour</h3>
            
            <label>Tên tour:</label>
            <input type="text" id="title" placeholder="VD: Tour Hạ Long - Cát Bà">

            <label>Mô tả chi tiết:</label>
            <textarea id="description" rows="3" placeholder="Nhập mô tả tour..."></textarea>

            <label>Thời gian:</label>
            <input type="text" id="duration" placeholder="VD: 3 ngày 2 đêm">

            <label>Nơi khởi hành:</label>
            <input type="text" id="departure" placeholder="VD: Hà Nội">

            <label>Giá người lớn (VNĐ):</label>
            <input type="number" id="adultPrice" placeholder="VD: 3500000">

</div>

</div>

            <label>Giá trẻ em (VNĐ):</label>
            <input type="number" id="childPrice" placeholder="VD: 1500000">

            <label>Link hình ảnh:</label>
            <input type="text" id="imageUrl" placeholder="Nhập link ảnh (.jpg, .png)">

            <div class="modal-actions">
                <button class="btn-save" onclick="saveTour()">Lưu</button>
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <div class="container" style="box-shadow: none; background: transparent; padding-bottom: 0;">
        <footer class="custom-footer">
            

<div class="form-group">
<input id="name" placeholder="Tên tour">
</div>

<div class="form-group">
<input id="price" placeholder="Giá">
</div>

<div class="form-group">
<input id="startDate" type="date">
</div>

<div class="form-group">
<input id="endDate" type="date">
</div>

<div class="form-group">
<label>Hình ảnh</label>
<input type="text" id="imageUrl" placeholder="Nhập link hình ảnh" oninput="previewImage()">
</div>

<img id="imagePreview" style="max-width:200px; margin-top:10px; display:none;">

<div class="form-buttons">
<button onclick="saveTour()">Lưu</button>
<button onclick="closeModal()">Hủy</button>
</div>
</div>
</div>
<script src="../js/tourservice.js"></script>
<script src="../js/tour-controller.js"></script>
</body>
</html>
