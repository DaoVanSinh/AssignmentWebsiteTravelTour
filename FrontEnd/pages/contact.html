<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <main class="main">
        <section class="title">

            <div class="container-title">

                <div class="title-text">
                    <span class="support">Hỗ trợ 24/7</span>

                    <h2>Liên hệ Chúng tôi</h2>

                    <p>
                        hãy hỏi để sắp xếp lịch trình.
                        Cứ gửi lời nhắn, chúng tôi sẽ hộ trợ sớm nhất có thể!
                    </p>
                </div>

                <div class="title-image">
                    <img src="../images/home.jpg" alt="travel">
                </div>

            </div>

        </section>
        <div class="container">
            <div class="main-contact">

                <div class="contact-info">

                    <div class="info-box">
                        <h3> Gọi khẩn cấp</h3>
                        <p>0123456789</p>
                    </div>

                    <div class="info-box">
                        <h3> Email</h3>
                        <p>yasuo@gmail.com</p>
                    </div>

                    <div class="info-box">
                        <h3> Địa chỉ</h3>
                        <p>123 Trần Duy Hưng, Q.ABC, TP.HN</p>
                    </div>

                </div>

                <div class="contact-form">

                    <h3>THÔNG TIN LIÊN LẠC :</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Loại thông tin :</label>
                            <select>
                                <option>Du lịch</option>
                                <option>Hỗ trợ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Họ tên :</label>
                            <input type="text" placeholder="Họ tên">
                        </div>

                        <div class="form-group">
                            <label>Email :</label>
                            <input type="email" placeholder="Nhập email">
                        </div>
                    </div>

                    <div class="boder">
                        <div class="form-1">
                            <label>Điện thoại :</label>
                            <input type="text" placeholder="Nhập số điện thoại">
                        </div>

                    </div>

                    <div class="form-2">
                        <label>Địa chỉ :</label>
                        <input type="text" placeholder="Nhập địa chỉ">
                    </div>

                    <div class="form-2">
                        <label>Tiêu đề :</label>
                        <input type="text" placeholder="Nhập tiêu đề">
                    </div>

                    <div class="form-2">
                        <label>Nội dung :</label>
                        <textarea rows="5" placeholder="Nhập nội dung"></textarea>
                    </div>

                    <div class="capcha">

                        <div class="capcha-left">
                            <input type="checkbox" id="checkCapcha">
                            <label for="checkCapcha">Tôi không phải là người máy</label>
                        </div>

                        <div class="capcha-right">
                            <img src="../images/capcha.png" alt="capcha">
                            <span>Privacy - Terms</span>
                        </div>

                    </div>

                    <button class="send" onclick="send()">Gửi ngay</button>

                </div>

            </div>

    </main>

</body>
<script>
    function send() {

        let captcha = document.getElementById("checkCapcha");

        if (!captcha.checked) {
            alert("Vui lòng xác nhận CAPTCHA");
            return;
        }

        alert("Cảm ơn ý kiến của bạn");

    }

</script>

</html>
