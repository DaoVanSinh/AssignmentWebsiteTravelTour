<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Đặt Tour</title>

<link rel="stylesheet" href="../css/booking.css">
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/footer.css">

</head>

<body>
<div id="header-placeholder"></div>

<div class="container">

    <div class="tour-detail">

        <div class="tour-image">
            <img id="tourImage" src="../images/tour.jpg">
        </div>

        <h2>Tour Vịnh Lan Hạ Cát Bà</h2>
        <p id="tourDescription"></p>
        <div class="tour-info">
            <p>Mã tour: <span id="tourCode">...</span></p>
            <p>Thời gian: <span id="duration">...</span></p>
            <p>Giá: <span id="price">...</span></p>
            <p class="tour-description" id="tourDescription"></p>
            <p>Nơi khởi hành: <span id="location">...</span></p>
        </div>

        <h3>Bảng giá tour chi tiết</h3>

        <table>

            <tr>
                <th>Loại</th>
                <th>Giá</th>
            </tr>

            <tr>
                <td>Người lớn</td>
                <td id="adultPrice"></td>
            </tr>

            <tr>
                <td>Trẻ em (&lt; 15 tuổi)</td>
                <td id="childPrice"></td>
            </tr>

        </table>

    </div>

<div class="right-sidebar">

    <div class="booking-form">

        <h3>THÔNG TIN KHÁCH HÀNG</h3>

        <form id="bookingForm">

            <input type="hidden" id="tourId" >

            <label>Họ và tên</label>
            <input type="text" id="customerName" placeholder="Nhập họ và tên" required> <p class="error" id="nameError"></p>

            <label>Số điện thoại</label>
            <input type="text" id="phone" placeholder="Nhập số điện thoại" required > <p class="error" id="phoneError"></p>

            <label>Email</label>
            <input type="email" id="email" placeholder="Nhập địa chỉ email" required>

            <label>Ngày khởi hành</label>
            <input type="date" id="departureDate" required>

            <label>Số lượng người lớn</label>
            <input type="number" id="adultQuantity" min="1" value="1" required> <p class="error" id="adultError"></p>
            
            <label>Số lượng trẻ em</label>
            <input type="number" id="childQuantity" min="0" value="0">

            <label>Yêu cầu khác</label>
            <input type="text" id="specialRequest" placeholder="Nhập yêu cầu khác (nếu có)">

            <button type="submit">
                ĐẶT TOUR
            </button>

        </form>

        <p id="message"></p>

    </div>

    <div class="support-box">

        <div class="support-bubble">
            Liên hệ tổng đài hỗ trợ
        </div>

        <p>Hotline: 0869724615</p>
        <p>Zalo: 0869724615</p>
    </div>

</div>

<script src="../js/booking.js"></script>

</div>

<div id="footer"></div>

    <script src="../js/config.js"></script>

<script>
    function loadComponent(id, path) {
    fetch(path)
    .then(response => response.text())
    .then(data => {
        document.getElementById(id).innerHTML = data;
        if(id === "header-placeholder"){
            const script = document.createElement("script");
            script.src = "../js/auth-check.js";
            document.body.appendChild(script);
        }
    });
    }
    loadComponent("header-placeholder","../components/header.html");
    loadComponent("footer","../components/footer.html");
</script>

</body>
</html>
