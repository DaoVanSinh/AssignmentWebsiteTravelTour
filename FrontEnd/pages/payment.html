<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="../css/payment.css">
</head>

<body>
    <h3 class="title">THÔNG TIN THANH TOÁN</h3>

    <div class="main">

        <div class="left-form">

            <p>Mã tour: <span id="tourCode"></span></p>

            <p>Thời gian: <span id="duration"></span></p>

            <p>Giá: <span id="price"></span></p>

            <p>Ngày khởi hành: <span id="date"></span></p>

            <p>Ngày kết thúc: <span id="endDate"></span></p>

            <p>Nơi khởi hành: <span id="location"></span></p>

        </div>

        <div class="right-from">

            <p>Họ và tên: <span id="customerName"></span></p>

            <p>Số điện thoại: <span id="phone"></span></p>

            <p>Email: <span id="email"></span></p>

            <p>Số người lớn: <span id="adultQuantity"></span></p>

            <p>Số trẻ em: <span id="childQuantity"></span></p>

            <p>Tổng số người: <span id="quantity"></span></p>

            <p>Yêu cầu: <span id="specialRequest"></span></p>

            <p>Tổng tiền: <span id="totalPrice"></span></p>

        </div>

    </div>

    <button type="button" id="buy">Thanh toán</button>

</body>

<script src="../js/payment.js"></script>

</html>
