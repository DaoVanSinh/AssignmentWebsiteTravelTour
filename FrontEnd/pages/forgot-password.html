<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="../css/register_login.css"/>
  </head>
  <body>
    <div class="page-account">
      <div class="form-account">
        <h2 class="inner-title">Quên mật khẩu</h2>
        <form class="inner-form" id="forgot-password-form">
          <div class="inner-group">
            <label class="inner-label" for="email">Email</label>
            <input class="inner-control" type="email" name="email" id="email" placeholder="Ví dụ: nguyendinha@gmail.com"/>
          </div>
          <button class="inner-button">Gửi mã OTP</button>
        </form>
        <div class="inner-more"><span>Bạn đã nhớ mật khẩu?</span><a href="../pages/login.html">Đăng nhập</a></div>
      </div>
    </div>

  </body>
</html>
