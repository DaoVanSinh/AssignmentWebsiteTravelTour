# URL kết nối: tour_db là tên Database bạn đã tạo trong MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tour_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Nhập mật khẩu bạn đã đặt lúc cài MySQL (ví dụ: 123456)
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate để tự động tạo bảng tours từ code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect